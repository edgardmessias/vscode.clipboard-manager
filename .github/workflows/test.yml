name: test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run unit tests
        run: npm test

      - name: Upload coverage
        if: always()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          npm run coverage
          for i in 1 2 3 4 5; do
            curl -s https://codecov.io/bash -o codecov.sh
            bash codecov.sh -f ./coverage/lcov.info && break
            sleep 5
          done
        shell: bash

  e2e:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        version: ["stable", "insiders"]
    runs-on: ${{ matrix.os }}-latest
    name: e2e ${{ matrix.os }} (VSCode ${{ matrix.version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Cache VSCode binary
        id: cache-vscode
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ matrix.version }}-${{ github.run_id }}
          restore-keys: |
            vscode-${{ runner.os }}-${{ matrix.version }}-

      - name: Run e2e tests
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm run test:e2e
        env:
          CODE_VERSION: ${{ matrix.version }}
        continue-on-error: ${{ matrix.version == 'insiders' }}

      - name: Remove old versions of VSCode
        if: always() && runner.os != 'Windows'
        run: ls -1 -d .vscode-test/vscode-* | sed -e '$ d' | xargs -I {} rm -rf {} || true
        shell: bash

  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Update changelog with unreleased changes
        run: npm run changelog:update -- -u

      - name: Package extension
        id: package
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "clipboard-manager-${{ github.sha }}.vsix"
          path: clipboard-manager.vsix
