name: test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run unit tests
        run: npm test

  e2e:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        version: ["stable", "insiders"]
    runs-on: ${{ matrix.os }}-latest
    name: e2e ${{ matrix.os }} (VSCode ${{ matrix.version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Cache VSCode binary
        id: cache-vscode
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ matrix.version }}-${{ github.run_id }}
          restore-keys: |
            vscode-${{ runner.os }}-${{ matrix.version }}-

      - name: Run e2e tests (Linux)
        if: runner.os == 'Linux'
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          run: npm run test:e2e
        env:
          CODE_VERSION: ${{ matrix.version }}
        continue-on-error: ${{ matrix.version == 'insiders' }}

      - name: Run e2e tests (macOS, with retry)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "e2e attempt ${attempt}/3"
            npm run test:e2e && exit 0
            if [ "${attempt}" -lt 3 ]; then
              echo "Attempt ${attempt} failed, retrying in 5s..."
              sleep 5
            fi
          done
          exit 1
        env:
          CODE_VERSION: ${{ matrix.version }}
        continue-on-error: ${{ matrix.version == 'insiders' }}

      - name: Run e2e tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
        env:
          CODE_VERSION: ${{ matrix.version }}
        continue-on-error: ${{ matrix.version == 'insiders' }}

      - name: Remove old versions of VSCode
        if: always() && runner.os != 'Windows'
        run: ls -1 -d .vscode-test/vscode-* | sed -e '$ d' | xargs -I {} rm -rf {} || true
        shell: bash

  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Update changelog with unreleased changes
        run: npm run changelog:update -- -u

      - name: Package extension
        id: package
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: "clipboard-manager-${{ github.sha }}.vsix"
          path: clipboard-manager.vsix
